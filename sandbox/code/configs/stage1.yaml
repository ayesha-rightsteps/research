# Stage 1 — 3 drones, static targets, no obstacles
# Goal: replicate DA-MAPPO mechanism (baseline)
#
# Values below are validated: code/notebooks/v3/v3-output/history.json shows
# 100% success, 0% collision on every one of 50 eval checkpoints across 5000
# episodes with this exact config (2026-09-15). See sessions/2026-09-15.md
# Parts 1-2 for how target_radius/success_bonus/ent_coef were tuned, and
# Part 4/6 for why "100% every time, zero variance" is itself a concern —
# an ablation (code/notebooks/v3/ablation/) is pending to check whether
# use_hungarian actually matters at this target_radius, before trusting this
# config as a real DA-MAPPO-replication checkpoint.

env:
  n_drones:         3
  n_obstacles:      0       # no obstacles in stage 1
  world_size:       500.0   # 500 m × 500 m; 1 unit = 1 metre
  max_speed:        5.0
  max_steps:        300     # max steps per episode
  target_radius:    25.0    # 5% of world_size — TRAINING CURRICULUM value, not
                            # the 5m "final evaluation" value in
                            # docs/research/00_problem_formalization.md Section
                            # 2.1. Tighten for final evaluation once the policy
                            # is more capable (Stage 2/3). Must defend this
                            # distinction to the supervisor — see
                            # docs/research/04_open_questions_for_supervisor.md.
  collision_radius: 3.0
  success_bonus:    20.0    # without this, Stage 1 got 0% success for 3000+
                            # episodes — pure distance shaping wasn't enough
  use_hungarian:    true    # ablation switch — set false to test whether the
                            # assignment mechanism matters (see notebooks/v3/ablation/)

mappo:
  lr:         0.0003
  gamma:      0.99
  lam:        0.95
  clip_eps:   0.2
  vf_coef:    0.5
  ent_coef:   0.003   # was 0.01, then 0.02 (too high — entropy rose instead of
                      # falling, see sessions/2026-09-15.md Part 2), settled at 0.003
  n_epochs:   10
  batch_size: 64

training:
  total_episodes:   5000    # was 3000; raised alongside the other v3/v4 fixes
  rollout_steps:    512     # steps collected before each update
  eval_every:       100     # evaluate every N episodes
  eval_episodes:    20      # episodes per evaluation
  save_every:       500     # save checkpoint every N episodes
  seed:             42

paths:
  results_dir:  code/results
  run_name:     stage1_seed42
